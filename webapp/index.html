<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Mossy</title>
  <link rel="stylesheet" href="css/mossy.css">
  <link rel="stylesheet" href="css/activiteiten.css">
  <!-- Volgorde: instellingen en gegevens eerst, daarna functies, schermen en als laatste app.js -->
  <script src="config.js" defer></script>
  <script src="data/dimensies.js" defer></script>
  <script src="data/iph-vragen.js" defer></script>
  <script src="js/sessie.js" defer></script>
  <script src="js/score.js" defer></script>
  <script src="js/spinnenweb-svg.js" defer></script>
  <script src="js/activiteiten/rekken.js" defer></script>
  <script src="js/activiteiten/ademhaling.js" defer></script>
  <script src="js/activiteiten/loslaten.js" defer></script>
  <script src="js/activiteiten/mediteren.js" defer></script>
  <script src="js/activiteiten/geluiden.js" defer></script>
  <script src="js/activiteiten/social-challenge.js" defer></script>
  <script src="js/activiteiten/morning-rush.js" defer></script>
  <script src="js/schermen/spinnenweb.js" defer></script>
  <script src="js/schermen/vragenlijst.js" defer></script>
  <script src="js/schermen/dimensiemenu.js" defer></script>
  <script src="js/schermen/dimensiepagina.js" defer></script>
  <script src="js/schermen/activiteiten.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body class="app">

  <header class="kop">
    <a class="merk" href="#/"><img src="images/mossy.png" alt=""><span>Mossy</span></a>
    <button type="button" class="knop klein-knop" id="bEinde">Sessie beëindigen</button>
  </header>

  <main id="inhoud"></main>

  <dialog id="eindDialoog" aria-labelledby="eindTitel">
    <h2 id="eindTitel">Sessie beëindigen?</h2>
    <p>Je antwoorden, je resultaat en je voortgang worden gewist. De volgende student begint weer bij het spinnenweb.</p>
    <div class="acties rij">
      <button type="button" class="knop primair" id="bEindeJa">Ja, wis alles</button>
      <button type="button" class="knop" id="bEindeNee">Annuleren</button>
    </div>
  </dialog>

  <dialog id="inactiefDialoog" aria-labelledby="inactiefTitel">
    <h2 id="inactiefTitel">Ben je er nog?</h2>
    <p>Je hebt een tijdje niets gedaan. Zonder reactie wordt je sessie over <b>30</b> seconden gewist.</p>
    <div class="acties rij">
      <button type="button" class="knop primair" id="bNogHier">Ja, ik ga verder</button>
    </div>
  </dialog>

</body>
</html>
